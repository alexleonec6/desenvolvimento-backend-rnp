# Configuracoes do Spring Boot para rodar com banco em memoria H2
spring.application.name=desenvolvimento-backend-rnp
server.port=8080

# Banco de dados H2 na memoria (reseta a cada execucao, perfeito para testes)
spring.datasource.url=jdbc:h2:mem:cursodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilitar console do H2 no navegador em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
